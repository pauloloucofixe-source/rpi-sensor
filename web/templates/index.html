<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Mina Inteligente</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #050914;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 8px;
        }

        h2 {
            margin-top: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #64748b;
        }

        .connection-dot.online {
            background: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
        }

        .connection-dot.offline {
            background: #ff3355;
            box-shadow: 0 0 8px #ff3355;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: #111827;
            border: 1px solid #24344d;
            border-radius: 12px;
            padding: 20px;
        }

        .value {
            font-size: 48px;
            font-weight: bold;
            color: #00d4ff;
        }

        .sub-value {
            margin-top: 5px;
            color: #94a3b8;
        }

        .status {
            font-size: 20px;
            margin: 10px 0;
        }

        .status strong {
            color: #00d4ff;
        }

        .health-ok {
            color: #00ffaa !important;
        }

        .health-error {
            color: #ff3355 !important;
        }

        .health-warning {
            color: #ffaa00 !important;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.15s;
        }

        button:hover {
            background: #00d4ff;
            color: black;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button:disabled:hover {
            background: transparent;
            color: inherit;
        }

        .danger {
            border-color: #ff3355;
            color: #ff3355;
        }

        .danger:hover {
            background: #ff3355;
            color: white;
        }

        .success {
            border-color: #00ffaa;
            color: #00ffaa;
        }

        .success:hover {
            background: #00ffaa;
            color: black;
        }

        .warning {
            border-color: #ffaa00;
            color: #ffaa00;
        }

        .warning:hover {
            background: #ffaa00;
            color: black;
        }

        .mode-active {
            background: #00d4ff;
            color: black;
        }

        #events {
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
        }

        .event {
            padding: 8px 6px;
            border-bottom: 1px solid #24344d;
            word-break: break-word;
        }

        .event-type {
            color: #00d4ff;
        }

        .event-time {
            color: #64748b;
        }

        .message {
            min-height: 20px;
            margin-top: 10px;
            font-size: 14px;
            color: #94a3b8;
        }

        .message.success-message {
            color: #00ffaa;
        }

        .message.error-message {
            color: #ff3355;
        }

        .message.warning-message {
            color: #ffaa00;
        }

        .last-update {
            margin-top: 8px;
            font-size: 12px;
            color: #64748b;
        }

        canvas {
            max-height: 300px;
        }
    </style>
</head>


<body>

    <!-- =====================================================
         HEADER
         ====================================================== -->

    <div class="header">

        <div>
            <h1>💧 Mina Inteligente</h1>

            <div class="connection-status">
                <span
                    id="connectionDot"
                    class="connection-dot"
                ></span>

                <span id="connectionText">
                    A ligar ao controlador...
                </span>
            </div>
        </div>

    </div>


    <!-- =====================================================
         MAIN GRID
         ====================================================== -->

    <div class="grid">


        <!-- =================================================
             WATER
             ================================================== -->

        <div class="card">

            <h2>Nível da Água</h2>

            <div
                class="value"
                id="level"
            >
                --
            </div>

            <div class="sub-value">
                <span id="liters">--</span> L
            </div>

            <div class="status">
                Controller:
                <strong id="health">
                    --
                </strong>
            </div>

            <div class="last-update">
                Última atualização:
                <span id="lastUpdate">
                    --
                </span>
            </div>

        </div>


        <!-- =================================================
             STATUS
             ================================================== -->

        <div class="card">

            <h2>Estado</h2>

            <div class="status">
                Furo:
                <strong id="borehole">
                    --
                </strong>
            </div>

            <div class="status">
                Rega:
                <strong id="pump">
                    --
                </strong>
            </div>

            <div class="status">
                Modo:
                <strong id="mode">
                    --
                </strong>
            </div>

        </div>


        <!-- =================================================
             PUMP
             ================================================== -->

        <div class="card">

            <h2>Bomba de Rega</h2>

            <button
                class="success"
                onclick="commandPump('ligar')"
            >
                💦 FORÇAR LIGAR
            </button>

            <button
                class="danger"
                onclick="commandPump('parar')"
            >
                ⛔ PARAR
            </button>

            <button
                onclick="commandPump('auto')"
            >
                🤖 AUTO
            </button>

            <div
                id="pumpMessage"
                class="message"
            ></div>

        </div>


        <!-- =================================================
             BOREHOLE
             ================================================== -->

        <div class="card">

            <h2>Furo</h2>

            <button
                class="success"
                onclick="commandBorehole('ligar')"
            >
                ⚡ LIGAR FURO
            </button>

            <button
                class="danger"
                onclick="commandBorehole('parar')"
            >
                ⛔ PARAR FURO
            </button>

            <div
                id="boreholeMessage"
                class="message"
            ></div>

        </div>


        <!-- =================================================
             SYSTEM MODE
             ================================================== -->

        <div class="card">

            <h2>Modo do Sistema</h2>

            <button
                id="modeAuto"
                onclick="commandMode('AUTO')"
            >
                🤖 AUTOMÁTICO
            </button>

            <button
                id="modeManualOn"
                class="success"
                onclick="commandMode('MANUAL_ON')"
            >
                🟢 MANUAL ON
            </button>

            <button
                id="modeManualOff"
                class="danger"
                onclick="commandMode('MANUAL_OFF')"
            >
                🔴 MANUAL OFF
            </button>

            <div
                id="modeMessage"
                class="message"
            ></div>

        </div>


        <!-- =================================================
             HISTORY
             ================================================== -->

        <div class="card">

            <h2>Nível - Histórico</h2>

            <canvas id="chart"></canvas>

        </div>


        <!-- =================================================
             EVENTS
             ================================================== -->

        <div class="card">

            <h2>Eventos</h2>

            <div id="events"></div>

        </div>


    </div>


<script>

let chart = null;


// ============================================================
// API
// ============================================================

async function api(url, options = {}) {

    const response = await fetch(
        url,
        {
            headers: {
                "Content-Type": "application/json"
            },
            ...options
        }
    );

    let data = {};

    try {
        data = await response.json();
    }
    catch (error) {
        data = {};
    }

    if (!response.ok) {

        throw new Error(
            data.error ||
            `HTTP ${response.status}`
        );
    }

    return data;
}


// ============================================================
// MESSAGE
// ============================================================

function showMessage(
    elementId,
    message,
    type = ""
) {

    const element =
        document.getElementById(elementId);

    element.innerText = message;

    element.className =
        "message " +
        (
            type
                ? `${type}-message`
                : ""
        );

    if (message) {

        setTimeout(
            () => {

                element.innerText = "";

                element.className =
                    "message";

            },
            4000
        );
    }
}


// ============================================================
// CONNECTION
// ============================================================

function updateConnectionStatus(connected) {

    const dot =
        document.getElementById(
            "connectionDot"
        );

    const text =
        document.getElementById(
            "connectionText"
        );

    if (connected) {

        dot.className =
            "connection-dot online";

        text.innerText =
            "Controller ligado";

    }
    else {

        dot.className =
            "connection-dot offline";

        text.innerText =
            "Controller offline";
    }
}


// ============================================================
// HEALTH
// ============================================================

function updateHealthDisplay(health) {

    const element =
        document.getElementById("health");

    element.classList.remove(
        "health-ok",
        "health-error",
        "health-warning"
    );

    const normalized =
        String(health || "")
            .toUpperCase();

    if (
        normalized === "ONLINE" ||
        normalized === "OK"
    ) {

        element.classList.add(
            "health-ok"
        );

    }
    else if (
        normalized === "OFFLINE" ||
        normalized === "ERROR"
    ) {

        element.classList.add(
            "health-error"
        );

    }
    else {

        element.classList.add(
            "health-warning"
        );
    }
}


// ============================================================
// STATUS
// ============================================================

async function updateStatus() {

    try {

        const data =
            await api("/api/status");


        // ----------------------------------------------------
        // WATER
        // ----------------------------------------------------

        const percentage =
            Number(data.pct);

        document.getElementById(
            "level"
        ).innerText =
            Number.isFinite(percentage)
                ? `${percentage.toFixed(1)}%`
                : "--";


        const liters =
            Number(data.litros);

        document.getElementById(
            "liters"
        ).innerText =
            Number.isFinite(liters)
                ? Math.round(liters)
                : "--";


        // ----------------------------------------------------
        // STATES
        // ----------------------------------------------------

        document.getElementById(
            "borehole"
        ).innerText =
            data.estado_furo || "--";


        document.getElementById(
            "pump"
        ).innerText =
            data.estado_rega || "--";


        document.getElementById(
            "mode"
        ).innerText =
            data.modo || "--";


        // ----------------------------------------------------
        // HEALTH
        // ----------------------------------------------------

        document.getElementById(
            "health"
        ).innerText =
            data.health || "UNKNOWN";

        updateHealthDisplay(
            data.health
        );


        // ----------------------------------------------------
        // MQTT CONNECTION
        // ----------------------------------------------------

        updateConnectionStatus(
            Boolean(data.mqtt_connected)
        );


        // ----------------------------------------------------
        // LAST UPDATE
        // ----------------------------------------------------

        document.getElementById(
            "lastUpdate"
        ).innerText =
            data.last_update || "--";


        // ----------------------------------------------------
        // MODE BUTTON
        // ----------------------------------------------------

        updateModeButtons(
            data.modo
        );

    }
    catch (error) {

        console.error(
            "Status error:",
            error
        );

        updateConnectionStatus(
            false
        );
    }
}


// ============================================================
// PUMP
// ============================================================

async function commandPump(action) {

    try {

        showMessage(
            "pumpMessage",
            "A enviar comando..."
        );

        await api(
            "/api/comando_bomba",
            {
                method: "POST",

                body: JSON.stringify({
                    acao: action
                })
            }
        );

        showMessage(
            "pumpMessage",
            "Comando enviado.",
            "success"
        );

        setTimeout(
            updateStatus,
            300
        );

    }
    catch (error) {

        console.error(
            "Pump command error:",
            error
        );

        showMessage(
            "pumpMessage",
            `Erro: ${error.message}`,
            "error"
        );
    }
}


// ============================================================
// BOREHOLE
// ============================================================

async function commandBorehole(action) {

    try {

        showMessage(
            "boreholeMessage",
            "A enviar comando..."
        );

        await api(
            "/api/comando_furo",
            {
                method: "POST",

                body: JSON.stringify({
                    acao: action
                })
            }
        );

        showMessage(
            "boreholeMessage",
            "Comando enviado.",
            "success"
        );

        setTimeout(
            updateStatus,
            300
        );

    }
    catch (error) {

        console.error(
            "Borehole command error:",
            error
        );

        showMessage(
            "boreholeMessage",
            `Erro: ${error.message}`,
            "error"
        );
    }
}


// ============================================================
// SYSTEM MODE
// ============================================================

async function commandMode(mode) {

    try {

        showMessage(
            "modeMessage",
            "A alterar modo..."
        );

        await api(
            "/api/comando_modo",
            {
                method: "POST",

                body: JSON.stringify({
                    modo: mode
                })
            }
        );

        showMessage(
            "modeMessage",
            `Modo ${mode} enviado.`,
            "success"
        );

        setTimeout(
            updateStatus,
            300
        );

    }
    catch (error) {

        console.error(
            "Mode command error:",
            error
        );

        showMessage(
            "modeMessage",
            `Erro: ${error.message}`,
            "error"
        );
    }
}


// ============================================================
// MODE BUTTONS
// ============================================================

function updateModeButtons(mode) {

    const buttons = [
        document.getElementById("modeAuto"),
        document.getElementById("modeManualOn"),
        document.getElementById("modeManualOff")
    ];

    buttons.forEach(
        button => {

            button.classList.remove(
                "mode-active"
            );

        }
    );


    if (mode === "AUTO") {

        document.getElementById(
            "modeAuto"
        ).classList.add(
            "mode-active"
        );

    }
    else if (mode === "MANUAL_ON") {

        document.getElementById(
            "modeManualOn"
        ).classList.add(
            "mode-active"
        );

    }
    else if (mode === "MANUAL_OFF") {

        document.getElementById(
            "modeManualOff"
        ).classList.add(
            "mode-active"
        );
    }
}


// ============================================================
// HISTORY
// ============================================================

async function updateHistory() {

    try {

        const data =
            await api("/api/historico");


        const labels =
            data.map(
                x => x.hora
            );


        const values =
            data.map(
                x => Number(x.val)
            );


        if (!chart) {

            chart =
                new Chart(
                    document
                        .getElementById("chart")
                        .getContext("2d"),

                    {
                        type: "line",

                        data: {
                            labels,

                            datasets: [{
                                label:
                                    "Nível (%)",

                                data:
                                    values,

                                borderWidth:
                                    2,

                                tension:
                                    0.3,

                                pointRadius:
                                    2
                            }]
                        },

                        options: {

                            responsive:
                                true,

                            maintainAspectRatio:
                                true,

                            scales: {

                                y: {
                                    min: 0,
                                    max: 100
                                }
                            },

                            plugins: {

                                legend: {
                                    display: true
                                }
                            }
                        }
                    }
                );

        }
        else {

            chart.data.labels =
                labels;

            chart.data.datasets[0].data =
                values;

            chart.update("none");
        }

    }
    catch (error) {

        console.error(
            "History error:",
            error
        );
    }
}


// ============================================================
// EVENTS
// ============================================================

async function updateEvents() {

    try {

        const data =
            await api("/api/eventos");


        const container =
            document.getElementById(
                "events"
            );


        container.innerHTML = "";


        if (!data.length) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "event";

            empty.innerText =
                "Sem eventos.";

            container.appendChild(
                empty
            );

            return;
        }


        data.forEach(
            event => {

                const element =
                    document.createElement(
                        "div"
                    );

                element.className =
                    "event";


                const time =
                    document.createElement(
                        "span"
                    );

                time.className =
                    "event-time";

                time.innerText =
                    `[${event.hora || "--"}] `;


                const type =
                    document.createElement(
                        "span"
                    );

                type.className =
                    "event-type";

                type.innerText =
                    event.tipo
                        ? `[${event.tipo}] `
                        : "";


                const message =
                    document.createElement(
                        "span"
                    );

                message.innerText =
                    event.msg || "";


                element.appendChild(
                    time
                );

                element.appendChild(
                    type
                );

                element.appendChild(
                    message
                );


                container.appendChild(
                    element
                );
            }
        );

    }
    catch (error) {

        console.error(
            "Events error:",
            error
        );
    }
}


// ============================================================
// INITIALIZATION
// ============================================================

async function updateAll() {

    await updateStatus();

    await updateHistory();

    await updateEvents();
}


updateAll();


// ============================================================
// REFRESH INTERVALS
// ============================================================

setInterval(
    updateStatus,
    3000
);

setInterval(
    updateHistory,
    15000
);

setInterval(
    updateEvents,
    5000
);

</script>

</body>
</html>
